<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간편 가계부</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-10">

    <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-lg">
        <h1 class="text-3xl font-bold mb-6 text-gray-800 text-center">💸 간편 가계부</h1>
        
        <!-- 입력 섹션 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <input type="date" id="date" class="border p-2 rounded w-full">
            <input type="text" id="desc" placeholder="내용" class="border p-2 rounded w-full">
            <input type="number" id="amount" placeholder="금액" class="border p-2 rounded w-full">
            <select id="type" class="border p-2 rounded w-full">
                <option value="지출">지출</option>
                <option value="수입">수입</option>
            </select>
        </div>
        <button onclick="addItem()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 mb-6">추가하기</button>

        <!-- 합계 섹션 -->
        <div class="grid grid-cols-2 gap-4 mb-6 text-center">
            <div class="bg-red-100 p-4 rounded-lg">
                <p class="text-sm text-red-600 font-bold">총 지출</p>
                <p id="totalExpense" class="text-xl font-bold">0원</p>
            </div>
            <div class="bg-green-100 p-4 rounded-lg">
                <p class="text-sm text-green-600 font-bold">총 수입</p>
                <p id="totalIncome" class="text-xl font-bold">0원</p>
            </div>
        </div>

        <!-- 리스트 섹션 -->
        <div class="overflow-y-auto max-h-80">
            <table class="w-full text-left">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="p-2">날짜</th>
                        <th class="p-2">내용</th>
                        <th class="p-2">금액</th>
                        <th class="p-2">분류</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </div>

    <script>
        let transactions = [];

        function addItem() {
            const date = document.getElementById('date').value;
            const desc = document.getElementById('desc').value;
            const amount = parseInt(document.getElementById('amount').value);
            const type = document.getElementById('type').value;

            if (!date || !desc || !amount) return alert("모든 항목을 입력하세요!");

            transactions.push({ date, desc, amount, type });
            updateUI();
        }

        function updateUI() {
            const tbody = document.getElementById('list');
            tbody.innerHTML = "";
            let income = 0;
            let expense = 0;

            transactions.forEach(t => {
                if (t.type === '수입') income += t.amount;
                else expense += t.amount;

                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-2">${t.date}</td>
                        <td class="p-2">${t.desc}</td>
                        <td class="p-2 ${t.type === '수입' ? 'text-green-600' : 'text-red-600'}">
                            ${t.type === '수입' ? '+' : '-'}${t.amount.toLocaleString()}원
                        </td>
                        <td class="p-2">${t.type}</td>
                    </tr>
                `;
            });

            document.getElementById('totalIncome').innerText = income.toLocaleString() + "원";
            document.getElementById('totalExpense').innerText = expense.toLocaleString() + "원";
        }
    </script>
</body>
</html>
